<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상상 나라 ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #ff7eb3;
      --secondary: #7ec8e3;
      --accent: #ffd166;
      --purple: #c77dff;
      --green: #80ed99;
      --bg-start: #fff0f6;
      --bg-end: #e8f4fd;
      --card-bg: rgba(255,255,255,0.85);
      --shadow: 0 8px 32px rgba(180,120,200,0.15);
      --radius: 20px;
    }

    body {
      font-family: 'Gaegu', cursive;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      min-height: 100vh;
      color: #4a3f6b;
      overflow-x: hidden;
    }

    /* 플로팅 배경 요소 */
    .bg-floats {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .float-item {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.25;
      animation: floatAnim linear infinite;
    }
    @keyframes floatAnim {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.25; }
      90% { opacity: 0.25; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    /* 헤더 */
    header {
      text-align: center;
      padding: 40px 0 24px;
    }
    .header-icon {
      font-size: 4rem;
      display: inline-block;
      animation: bounce 1.8s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }
    header h1 {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 3rem;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-top: 8px;
      letter-spacing: 2px;
    }
    header p {
      font-size: 1.15rem;
      color: #888;
      margin-top: 6px;
    }

    /* 카드 공통 */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 20px;
      border: 1.5px solid rgba(255,255,255,0.7);
    }
    .card h2 {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 1.4rem;
      color: var(--purple);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* API 키 패널 */
    .api-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .api-row input {
      flex: 1;
      min-width: 200px;
      padding: 12px 16px;
      border: 2px solid #e0d0f0;
      border-radius: 12px;
      font-family: 'Gaegu', cursive;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .api-row input:focus { border-color: var(--primary); }
    .api-status {
      font-size: 0.9rem;
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
    }
    .api-status.set { background: #d4f8e8; color: #2d8653; }
    .api-status.unset { background: #ffe0e0; color: #c0392b; }
    .api-hint {
      font-size: 0.85rem;
      color: #999;
      margin-top: 8px;
    }
    .api-hint a { color: var(--secondary); }

    /* 버튼 공통 */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-family: 'Do Hyeon', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--purple));
      color: white;
      box-shadow: 0 4px 15px rgba(199,125,255,0.3);
    }
    .btn-secondary {
      background: linear-gradient(135deg, var(--secondary), #5ba8c9);
      color: white;
    }
    .btn-small {
      padding: 8px 16px;
      font-size: 0.9rem;
    }
    .btn-accent {
      background: linear-gradient(135deg, var(--accent), #f4a261);
      color: #4a3f6b;
    }

    /* 입력 폼 */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 0.95rem;
      color: #6a5f8a;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 12px 16px;
      border: 2px solid #e0d0f0;
      border-radius: 12px;
      font-family: 'Gaegu', cursive;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      background: white;
      color: #4a3f6b;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--primary); }
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }
    .char-counter {
      font-size: 0.85rem;
      color: #aaa;
      text-align: right;
    }
    .char-counter.warn { color: var(--primary); }

    .generate-btn {
      width: 100%;
      padding: 18px;
      font-size: 1.3rem;
      border-radius: 16px;
      margin-top: 8px;
      letter-spacing: 1px;
    }
    .generate-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255,126,179,0.4);
    }

    /* 로딩 */
    #loading-box { display: none; }
    .loading-title {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 1.4rem;
      text-align: center;
      color: var(--purple);
      margin-bottom: 20px;
    }
    .loading-spinner {
      width: 56px; height: 56px;
      border: 5px solid #f0e0ff;
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #f8f0ff;
      color: #bbb;
      transition: all 0.3s;
    }
    .step.active {
      background: linear-gradient(135deg, #f0e0ff, #e0f0ff);
      color: var(--purple);
      box-shadow: 0 4px 12px rgba(199,125,255,0.2);
    }
    .step.done {
      background: #e8f8f0;
      color: #2d8653;
    }
    .step-icon { font-size: 1.3rem; }
    .step-label { font-size: 1rem; }

    /* 결과 */
    #result-box { display: none; }
    .story-title {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 2rem;
      text-align: center;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .characters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .char-tag {
      background: linear-gradient(135deg, var(--accent), #f4a261);
      color: #4a3f6b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    /* 탭 */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 18px;
      border: 2px solid #e0d0f0;
      border-radius: 20px;
      background: white;
      color: #aaa;
      font-family: 'Do Hyeon', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--purple));
      border-color: transparent;
      color: white;
      box-shadow: 0 4px 12px rgba(199,125,255,0.3);
    }

    /* 페이지 */
    .page-content { display: none; }
    .page-content.active { display: block; }
    .page-image-wrap {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #f0e0ff, #e0f4ff);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .page-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #bbb;
    }
    .image-placeholder .icon { font-size: 3rem; }
    .image-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #e07070;
    }
    .page-text {
      font-size: 1.2rem;
      line-height: 1.8;
      text-align: center;
      padding: 16px;
      background: linear-gradient(135deg, #fff8ff, #f0faff);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .page-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .page-indicator {
      font-family: 'Do Hyeon', sans-serif;
      color: #aaa;
      font-size: 1rem;
    }

    /* 교훈 */
    .moral-box {
      background: linear-gradient(135deg, #fff9e0, #fff0c0);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
    }
    .moral-box .icon { font-size: 2rem; }
    .moral-box p {
      font-size: 1.15rem;
      color: #8a6a00;
      margin-top: 8px;
      line-height: 1.6;
    }

    /* 내보내기 */
    .export-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    /* 에러/알림 */
    .alert {
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 1rem;
    }
    .alert-error { background: #ffe0e0; color: #c0392b; border: 1px solid #f5c6c6; }
    .alert-info { background: #e0f0ff; color: #2563a8; border: 1px solid #b0d0f0; }

    /* 인쇄 */
    @media print {
      .bg-floats, #api-panel, #input-form, #loading-box,
      .tabs, .page-nav, .export-row, header { display: none !important; }
      .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
      #result-box { display: block !important; }
      .page-content { display: block !important; break-inside: avoid; margin-bottom: 30px; }
      body { background: white; }
    }
  </style>
</head>
<body>

<!-- 배경 플로팅 요소 -->
<div class="bg-floats" id="bg-floats"></div>

<div class="container">

  <!-- 헤더 -->
  <header>
    <div class="header-icon">📖</div>
    <h1>상상 나라</h1>
    <p>아이의 상상이 동화책이 되는 마법 같은 공간 ✨</p>
  </header>

  <!-- API 키 패널 -->
  <div class="card" id="api-panel">
    <h2>🔑 API 키 설정</h2>
    <div class="api-row">
      <input type="password" id="gemini-key-input" placeholder="Gemini API 키를 입력하세요" />
      <button class="btn btn-secondary btn-small" onclick="saveApiKey()">저장</button>
      <button class="btn btn-small" style="background:#f0e0ff;color:#7a5faa;" onclick="clearApiKey()">초기화</button>
    </div>
    <div id="api-status" class="api-status unset">⚠️ API 키가 설정되지 않았습니다</div>
    <p class="api-hint">
      Gemini API 키는 <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 무료로 발급받을 수 있습니다.<br>
      API 키는 브라우저에만 저장되며 서버로 안전하게 전달됩니다.
    </p>
  </div>

  <!-- 이야기 입력 폼 -->
  <div class="card" id="input-form">
    <h2>🌈 아이의 이야기 입력</h2>
    <div class="form-row">
      <div class="form-group">
        <label>아이 이름 (선택)</label>
        <input type="text" id="child-name" placeholder="예: 민지" maxlength="20" />
      </div>
      <div class="form-group">
        <label>나이 (선택)</label>
        <input type="text" id="child-age" placeholder="예: 6살" maxlength="10" />
      </div>
    </div>
    <div class="form-group" style="margin-bottom:12px;">
      <label>아이가 말한 이야기나 상상 ✍️</label>
      <textarea id="story-input" placeholder="아이가 상상한 이야기를 입력해주세요. 예: '나는 용을 타고 하늘을 날아서 사탕 왕국에 갔어요. 그곳에서 초콜릿 강을 수영했어요!'" maxlength="500" oninput="updateCounter()"></textarea>
      <div class="char-counter" id="char-counter">0 / 500</div>
    </div>
    <div class="form-group" style="margin-bottom:16px;">
      <label>삽화 스타일</label>
      <select id="story-style">
        <option value="watercolor">🎨 수채화 - 따뜻하고 부드러운 느낌</option>
        <option value="cartoon">🖍️ 만화 - 밝고 생동감 있는 느낌</option>
        <option value="dreamlike">✨ 몽환적 - 신비롭고 마법 같은 느낌</option>
        <option value="pixel">👾 픽셀 - 귀엽고 레트로한 느낌</option>
        <option value="pastel">🌸 파스텔 - 카와이 스타일의 부드러운 느낌</option>
      </select>
    </div>
    <div id="form-error"></div>
    <button class="btn btn-primary generate-btn" onclick="generateStory()">
      🌟 동화 만들기!
    </button>
  </div>

  <!-- 로딩 -->
  <div class="card" id="loading-box">
    <div class="loading-title">✨ 마법의 동화를 만들고 있어요...</div>
    <div class="loading-spinner"></div>
    <div class="steps">
      <div class="step" id="step-1">
        <span class="step-icon">📝</span>
        <span class="step-label">이야기를 동화로 변환하는 중...</span>
      </div>
      <div class="step" id="step-2">
        <span class="step-icon">🎨</span>
        <span class="step-label">각 페이지의 그림을 그리는 중...</span>
      </div>
      <div class="step" id="step-3">
        <span class="step-icon">📖</span>
        <span class="step-label">동화책을 완성하는 중...</span>
      </div>
    </div>
  </div>

  <!-- 결과 -->
  <div id="result-box">
    <div class="card">
      <div class="story-title" id="story-title"></div>
      <div class="characters-row" id="characters-row"></div>
      <div class="tabs" id="tabs"></div>
      <div id="pages-container"></div>
      <div class="moral-box" id="moral-box"></div>
      <div class="export-row">
        <button class="btn btn-secondary" onclick="window.print()">🖨️ 인쇄하기</button>
        <button class="btn btn-accent" onclick="copyText()">📋 텍스트 복사</button>
        <button class="btn btn-primary" onclick="resetApp()">🌟 새 이야기 만들기</button>
      </div>
    </div>
  </div>

</div>

<script>
  // ─── 배경 플로팅 ───────────────────────────────────────────
  const floatItems = ['⭐','🌟','✨','🌸','🌈','🦋','🌙','☁️','🎈','🌺'];
  const bgFloats = document.getElementById('bg-floats');
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'float-item';
    el.textContent = floatItems[i % floatItems.length];
    el.style.left = `${Math.random() * 100}%`;
    el.style.animationDuration = `${8 + Math.random() * 14}s`;
    el.style.animationDelay = `${Math.random() * 12}s`;
    el.style.fontSize = `${1 + Math.random() * 1.5}rem`;
    bgFloats.appendChild(el);
  }

  // ─── 스타일 프롬프트 힌트 ──────────────────────────────────
  const stylePrompts = {
    watercolor: "soft watercolor illustration, children's book art style, warm pastel colors",
    cartoon: "cute cartoon illustration, vibrant colors, bold outlines, cheerful children's animation style",
    dreamlike: "dreamy magical illustration, ethereal glowing light, fantasy art, mystical atmosphere",
    pixel: "cute pixel art, 16-bit video game style, colorful pixels, retro charm",
    pastel: "soft pastel illustration, kawaii style, gentle colors, adorable characters"
  };

  // ─── API 키 관리 ──────────────────────────────────────────
  let geminiApiKey = '';

  function loadApiKey() {
    const saved = localStorage.getItem('gemini_api_key');
    if (saved) {
      geminiApiKey = saved;
      document.getElementById('gemini-key-input').value = saved;
      updateApiStatus(true);
    }
  }

  function saveApiKey() {
    const val = document.getElementById('gemini-key-input').value.trim();
    if (!val) { alert('API 키를 입력해주세요.'); return; }
    geminiApiKey = val;
    localStorage.setItem('gemini_api_key', val);
    updateApiStatus(true);
  }

  function clearApiKey() {
    geminiApiKey = '';
    localStorage.removeItem('gemini_api_key');
    document.getElementById('gemini-key-input').value = '';
    updateApiStatus(false);
  }

  function updateApiStatus(isSet) {
    const el = document.getElementById('api-status');
    if (isSet) {
      el.className = 'api-status set';
      el.textContent = '✅ API 키가 설정되었습니다';
    } else {
      el.className = 'api-status unset';
      el.textContent = '⚠️ API 키가 설정되지 않았습니다';
    }
  }

  // ─── 글자 수 카운터 ───────────────────────────────────────
  function updateCounter() {
    const ta = document.getElementById('story-input');
    const counter = document.getElementById('char-counter');
    const len = ta.value.length;
    counter.textContent = `${len} / 500`;
    counter.className = 'char-counter' + (len > 450 ? ' warn' : '');
  }

  // ─── 에러 표시 ────────────────────────────────────────────
  function showFormError(msg) {
    const el = document.getElementById('form-error');
    el.innerHTML = `<div class="alert alert-error">⚠️ ${msg}</div>`;
  }
  function clearFormError() {
    document.getElementById('form-error').innerHTML = '';
  }

  // ─── 로딩 단계 제어 ──────────────────────────────────────
  function setStep(stepNum) {
    for (let i = 1; i <= 3; i++) {
      const el = document.getElementById(`step-${i}`);
      el.className = 'step';
      if (i < stepNum) el.classList.add('done');
      else if (i === stepNum) el.classList.add('active');
    }
  }

  // ─── 메인 생성 로직 ──────────────────────────────────────
  let currentStory = null;
  let pageImages = [];

  async function generateStory() {
    clearFormError();

    const storyInput = document.getElementById('story-input').value.trim();
    if (!storyInput) {
      showFormError('아이의 이야기를 입력해주세요!');
      return;
    }
    if (!geminiApiKey) {
      showFormError('삽화 생성을 위해 Gemini API 키를 먼저 설정해주세요!');
      return;
    }

    const childName = document.getElementById('child-name').value.trim();
    const childAge = document.getElementById('child-age').value.trim();
    const style = document.getElementById('story-style').value;

    // UI 상태 전환
    document.getElementById('input-form').style.display = 'none';
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('loading-box').style.display = 'block';
    setStep(1);

    try {
      // 1단계: 스토리 생성
      const storyRes = await fetch('/api/generate-story', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ childStory: storyInput, childName, age: childAge }),
      });
      const storyData = await storyRes.json();
      if (!storyRes.ok || storyData.error) {
        throw new Error(storyData.error || '스토리 생성에 실패했습니다.');
      }
      currentStory = storyData;

      // 2단계: 이미지 생성
      setStep(2);
      pageImages = new Array(currentStory.pages.length).fill(null);
      const styleHint = stylePrompts[style] || stylePrompts.watercolor;

      for (let i = 0; i < currentStory.pages.length; i++) {
        const page = currentStory.pages[i];
        const fullPrompt = `${page.imagePrompt}, ${styleHint}, no text, no words, child-friendly, safe for kids`;
        try {
          const imgRes = await fetch('/api/generate-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: fullPrompt, apiKey: geminiApiKey }),
          });
          const imgData = await imgRes.json();
          if (imgData.error) throw new Error(imgData.error);
          pageImages[i] = imgData;
        } catch (imgErr) {
          pageImages[i] = { error: imgErr.message };
        }
        // Rate limit 방지
        if (i < currentStory.pages.length - 1) {
          await new Promise(r => setTimeout(r, 300));
        }
      }

      // 3단계: 완성
      setStep(3);
      await new Promise(r => setTimeout(r, 500));

      renderResult(style);
    } catch (err) {
      document.getElementById('loading-box').style.display = 'none';
      document.getElementById('input-form').style.display = 'block';
      showFormError(`오류가 발생했습니다: ${err.message}`);
    }
  }

  // ─── 결과 렌더링 ─────────────────────────────────────────
  function renderResult(style) {
    document.getElementById('loading-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';

    document.getElementById('story-title').textContent = `📖 ${currentStory.title}`;

    // 등장인물
    const charsEl = document.getElementById('characters-row');
    charsEl.innerHTML = (currentStory.characters || [])
      .map(c => `<span class="char-tag">👤 ${c}</span>`)
      .join('');

    // 탭
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = currentStory.pages
      .map((p, i) => `<button class="tab-btn${i === 0 ? ' active' : ''}" onclick="showPage(${i})">${p.pageNumber}페이지</button>`)
      .join('');

    // 페이지 콘텐츠
    const pagesEl = document.getElementById('pages-container');
    pagesEl.innerHTML = currentStory.pages
      .map((page, i) => {
        const imgData = pageImages[i];
        let imgHtml;
        if (imgData && imgData.imageBase64) {
          imgHtml = `<img src="data:${imgData.mimeType};base64,${imgData.imageBase64}" alt="${page.pageNumber}페이지 삽화" />`;
        } else if (imgData && imgData.error) {
          imgHtml = `<div class="image-error">
            <div class="icon">⚠️</div>
            <div>이미지 생성 실패</div>
            <div style="font-size:0.8rem;color:#aaa;margin:4px 0;">${imgData.error.slice(0,80)}</div>
            <button class="btn btn-small btn-accent" onclick="retryImage(${i})">🔄 다시 시도</button>
          </div>`;
        } else {
          imgHtml = `<div class="image-placeholder"><div class="icon">🎨</div><div>이미지 없음</div></div>`;
        }

        return `<div class="page-content${i === 0 ? ' active' : ''}" id="page-${i}">
          <div class="page-image-wrap">${imgHtml}</div>
          <div class="page-text">${page.text}</div>
          <div class="page-nav">
            <button class="btn btn-small btn-secondary" onclick="prevPage(${i})" ${i === 0 ? 'disabled style="opacity:0.4;"' : ''}>← 이전</button>
            <span class="page-indicator">${page.pageNumber} / ${currentStory.pages.length}</span>
            <button class="btn btn-small btn-primary" onclick="nextPage(${i})" ${i === currentStory.pages.length - 1 ? 'disabled style="opacity:0.4;"' : ''}>다음 →</button>
          </div>
        </div>`;
      })
      .join('');

    // 교훈
    const moralEl = document.getElementById('moral-box');
    moralEl.innerHTML = `<div class="icon">⭐</div><p>💬 ${currentStory.moral}</p>`;

    document.getElementById('result-box').scrollIntoView({ behavior: 'smooth' });
  }

  // ─── 페이지 탭 제어 ──────────────────────────────────────
  let currentPage = 0;

  function showPage(idx) {
    document.querySelectorAll('.page-content').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });
    document.querySelectorAll('.tab-btn').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });
    currentPage = idx;
  }

  function prevPage(idx) { if (idx > 0) showPage(idx - 1); }
  function nextPage(idx) { if (currentStory && idx < currentStory.pages.length - 1) showPage(idx + 1); }

  // ─── 이미지 재시도 ───────────────────────────────────────
  async function retryImage(idx) {
    if (!currentStory || !geminiApiKey) return;
    const style = document.getElementById('story-style')?.value || 'watercolor';
    const styleHint = stylePrompts[style] || stylePrompts.watercolor;
    const page = currentStory.pages[idx];
    const fullPrompt = `${page.imagePrompt}, ${styleHint}, no text, no words, child-friendly, safe for kids`;

    const wrap = document.querySelector(`#page-${idx} .page-image-wrap`);
    wrap.innerHTML = `<div class="image-placeholder"><div class="loading-spinner" style="width:40px;height:40px;border-width:4px;"></div><div>다시 그리는 중...</div></div>`;

    try {
      const imgRes = await fetch('/api/generate-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: fullPrompt, apiKey: geminiApiKey }),
      });
      const imgData = await imgRes.json();
      if (imgData.error) throw new Error(imgData.error);
      pageImages[idx] = imgData;
      wrap.innerHTML = `<img src="data:${imgData.mimeType};base64,${imgData.imageBase64}" alt="${page.pageNumber}페이지 삽화" />`;
    } catch (err) {
      pageImages[idx] = { error: err.message };
      wrap.innerHTML = `<div class="image-error">
        <div class="icon">⚠️</div>
        <div>이미지 생성 실패</div>
        <div style="font-size:0.8rem;color:#aaa;margin:4px 0;">${err.message.slice(0,80)}</div>
        <button class="btn btn-small btn-accent" onclick="retryImage(${idx})">🔄 다시 시도</button>
      </div>`;
    }
  }

  // ─── 텍스트 복사 ─────────────────────────────────────────
  async function copyText() {
    if (!currentStory) return;
    let text = `📖 ${currentStory.title}\n\n`;
    currentStory.pages.forEach(p => {
      text += `【${p.pageNumber}페이지】\n${p.text}\n\n`;
    });
    text += `⭐ 교훈: ${currentStory.moral}`;
    try {
      await navigator.clipboard.writeText(text);
      alert('텍스트가 클립보드에 복사되었습니다! 📋');
    } catch {
      alert('복사에 실패했습니다. 직접 텍스트를 선택해 복사해주세요.');
    }
  }

  // ─── 초기화 ──────────────────────────────────────────────
  function resetApp() {
    currentStory = null;
    pageImages = [];
    currentPage = 0;
    document.getElementById('story-input').value = '';
    document.getElementById('child-name').value = '';
    document.getElementById('child-age').value = '';
    updateCounter();
    clearFormError();
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('input-form').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ─── 초기 로드 ───────────────────────────────────────────
  loadApiKey();
</script>
</body>
</html>
