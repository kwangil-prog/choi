<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상상 나라 ✨</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />

  <!-- 스타일시트 -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 배경 플로팅 요소 (js/ui.js에서 동적 생성) -->
  <div class="bg-floats" id="bg-floats"></div>

  <div class="container">

    <!-- ── 헤더 ───────────────────────────────────────── -->
    <header>
      <div class="header-icon">📖</div>
      <h1>상상 나라</h1>
      <p>아이의 상상이 동화책이 되는 마법 같은 공간 ✨</p>
    </header>

    <!-- ── API 키 패널 ──────────────────────────────────── -->
    <div class="card" id="api-panel">
      <h2>🔑 API 키 설정</h2>
      <div class="api-row">
        <input
          type="password"
          id="gemini-key-input"
          placeholder="Gemini API 키를 입력하세요"
        />
        <button class="btn btn-secondary btn-small" onclick="App.saveApiKey()">저장</button>
        <button class="btn btn-ghost btn-small" onclick="App.clearApiKey()">초기화</button>
      </div>
      <div id="api-status" class="api-status unset">⚠️ API 키가 설정되지 않았습니다</div>
      <p class="api-hint">
        Gemini API 키는
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">
          Google AI Studio
        </a>에서 무료로 발급받을 수 있습니다.<br />
        API 키는 브라우저에만 저장되며 서버로 안전하게 전달됩니다.
      </p>
    </div>

    <!-- ── 이야기 입력 폼 ───────────────────────────────── -->
    <div class="card" id="input-form">
      <h2>🌈 아이의 이야기 입력</h2>

      <div class="form-row">
        <div class="form-group">
          <label for="child-name">아이 이름 (선택)</label>
          <input type="text" id="child-name" placeholder="예: 민지" maxlength="20" />
        </div>
        <div class="form-group">
          <label for="child-age">나이 (선택)</label>
          <input type="text" id="child-age" placeholder="예: 6살" maxlength="10" />
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 12px;">
        <label for="story-input">아이가 말한 이야기나 상상 ✍️</label>
        <textarea
          id="story-input"
          maxlength="500"
          placeholder="아이가 상상한 이야기를 입력해주세요. 예: '나는 용을 타고 하늘을 날아서 사탕 왕국에 갔어요!'"
        ></textarea>
        <div class="char-counter" id="char-counter">0 / 500</div>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label for="story-style">삽화 스타일</label>
        <select id="story-style">
          <option value="watercolor">🎨 수채화 - 따뜻하고 부드러운 느낌</option>
          <option value="cartoon">🖍️ 만화 - 밝고 생동감 있는 느낌</option>
          <option value="dreamlike">✨ 몽환적 - 신비롭고 마법 같은 느낌</option>
          <option value="pixel">👾 픽셀 - 귀엽고 레트로한 느낌</option>
          <option value="pastel">🌸 파스텔 - 카와이 스타일의 부드러운 느낌</option>
        </select>
      </div>

      <!-- 에러 메시지 -->
      <div id="form-error"></div>

      <button class="btn btn-primary generate-btn" onclick="App.generate()">
        🌟 동화 만들기!
      </button>
    </div>

    <!-- ── 로딩 ────────────────────────────────────────── -->
    <div class="card" id="loading-box" style="display: none;">
      <div class="loading-title">✨ 마법의 동화를 만들고 있어요...</div>
      <div class="loading-spinner"></div>
      <div class="steps">
        <div class="step" id="step-1">
          <span class="step-icon">📝</span>
          <span class="step-label">이야기를 동화로 변환하는 중...</span>
        </div>
        <div class="step" id="step-2">
          <span class="step-icon">🎨</span>
          <span class="step-label">각 페이지의 그림을 그리는 중...</span>
        </div>
        <div class="step" id="step-3">
          <span class="step-icon">📖</span>
          <span class="step-label">동화책을 완성하는 중...</span>
        </div>
      </div>
    </div>

    <!-- ── 결과 ────────────────────────────────────────── -->
    <div id="result-box" style="display: none;">
      <div class="card">
        <div class="story-title" id="story-title"></div>
        <div class="characters-row" id="characters-row"></div>
        <div class="tabs" id="tabs"></div>
        <div id="pages-container"></div>
        <div class="moral-box" id="moral-box"></div>

        <div class="export-row">
          <button class="btn btn-secondary" onclick="window.print()">🖨️ 인쇄하기</button>
          <button class="btn btn-accent" onclick="App.copyText()">📋 텍스트 복사</button>
          <button class="btn btn-primary" onclick="App.resetApp()">🌟 새 이야기 만들기</button>
        </div>
      </div>
    </div>

  </div><!-- /.container -->

  <!-- JavaScript (의존 순서 중요: api → ui → app) -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
